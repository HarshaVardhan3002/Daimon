# Reasoning dial over the keyboard: type a draft, open the dial with the keyboard up (the keyboard should be dark and
# shaded), pick Medium (tap the centre stop), Instant and High (drag to either end), close it the way VoiceOver
# exposes it, then keep typing into the same draft.
appId: ${APP_ID}
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Add attachment|Sign in"
    timeout: 60000
- runFlow:
    when:
      visible: "Sign in"
    file: _sign-in.yaml
- tapOn:
    id: "composer-input"
- inputText: "dial check"
- waitForAnimationToEnd
- takeScreenshot: ios-13-keyboard-draft
# The dial lives behind Think harder in the plus menu; switching it on shows the gauge in the composer.
- tapOn: "Add attachment"
- waitForAnimationToEnd
- takeScreenshot: ios-13b-plus-menu
- tapOn: "Think harder"
- waitForAnimationToEnd
- tapOn: "Thinking dial.*"
- extendedWaitUntil:
    visible:
      id: "reasoning-effort-dial"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: ios-14-dial-open-keyboard
- tapOn:
    id: "reasoning-effort-dial"
- extendedWaitUntil:
    visible: ".*Medium effort.*"
    timeout: 3000
- takeScreenshot: ios-15-dial-medium
- swipe:
    from:
      id: "reasoning-effort-dial"
    direction: LEFT
    duration: 600
- extendedWaitUntil:
    visible: ".*Instant effort.*"
    timeout: 3000
- takeScreenshot: ios-16-dial-instant
- swipe:
    from:
      id: "reasoning-effort-dial"
    direction: RIGHT
    duration: 600
- extendedWaitUntil:
    visible: ".*High effort.*"
    timeout: 3000
- takeScreenshot: ios-17-dial-high
# VoiceOver must be able to reach the close control while the dial is modal.
- assertVisible: "Close reasoning effort"
# Tap the dimmed area above the dial, as a sighted user would.
- tapOn:
    point: "50%,20%"
- waitForAnimationToEnd
- assertNotVisible: "Close reasoning effort"
- assertVisible: "Thinking dial: High"
- assertVisible: "dial check"
- tapOn: "dial check"
- inputText: " more"
- assertVisible: "dial check more"
- takeScreenshot: ios-18-dial-closed-typing
